name: Publish Councillion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run game tests
        run: npm test

      - name: Build static site
        env:
          COUNCIL_SUPABASE_URL: ${{ vars.COUNCIL_SUPABASE_URL }}
          COUNCIL_SUPABASE_ANON_KEY: ${{ vars.COUNCIL_SUPABASE_ANON_KEY }}
        run: python3 build.py

      - uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: council-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify uploaded website is visible
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: council-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 6; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                per_page: 100
              });
              core.info(JSON.stringify(data.artifacts.map(a => ({
                id: a.id,
                name: a.name,
                expired: a.expired
              }))));
              if (data.artifacts.some(a =>
                a.name === process.env.PAGES_ARTIFACT && !a.expired
              )) return;
              if (attempt < 5)
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('GitHub cannot list the uploaded artifact. See the artifact listing above.');

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: council-pages-${{ github.run_id }}-${{ github.run_attempt }}

:root {
  color-scheme: dark;
  --ink: #18131d;
  --deep: #120f16;
  --panel: #211a27;
  --panel-light: #2a2131;
  --cream: #fff4df;
  --muted: #b9aebd;
  --line: #46354c;
  --orange: #f7a35b;
  --orange-dark: #a95435;
  --cyan: #82d9cf;
  --gold: #ffdc77;
  --red: #ff8f8c;
  --green: #afd6a0;
  --display: "CouncilPixel", "Courier New", monospace;
  --body: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 26px; }
body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--body); font-size: 14px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(#b794ca13 .7px, transparent .7px); background-size: 8px 8px; opacity: .5; z-index: -1; }
button, input, textarea, select { font: inherit; }
button, a, summary, select { -webkit-tap-highlight-color: transparent; }
button, summary { cursor: pointer; }
button { color: inherit; }
input, textarea, select { max-width: 100%; color: var(--cream); }
button:disabled { cursor: not-allowed; opacity: .5; transform: none !important; }
a { color: var(--cyan); text-underline-offset: 4px; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--cyan); outline-offset: 5px; }
button, a, input, textarea, select, summary { touch-action: manipulation; }
svg { max-width: 100%; display: inline-block; vertical-align: middle; }
h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; }
p { margin-bottom: 1.15em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
[hidden] { display: none !important; }
.screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.app-shell { min-height: 100svh; display: flex; flex-direction: column; }
.container { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }
main#main { flex: 1; padding-bottom: 76px; }
.topbar { min-height: 91px; display: flex; align-items: center; gap: 38px; border-bottom: 1px solid var(--line); padding: 20px 0; }
.brand { display: inline-flex; align-items: center; gap: 11px; background: none; border: 0; padding: 0; font-family: var(--display); font-weight: 900; font-size: 19px; letter-spacing: -1px; color: var(--cream); text-decoration: none; white-space: nowrap; }
.brand-icon { color: var(--orange); width: 31px; height: 31px; display: grid; place-items: center; font-size: 25px; }
.brand-icon svg { image-rendering: pixelated; }
.nav-links { display: flex; gap: 25px; flex: 1; align-items: center; }
.nav-btn { background: transparent; border: 0; padding: 9px 0; font-size: 12px; color: var(--muted); position: relative; }
.nav-btn:hover, .nav-btn.active { color: var(--cream); }
.nav-btn.active::after { position: absolute; content: ""; left: 0; bottom: 0; height: 3px; width: 18px; background: var(--orange); }
.header-actions { display: flex; gap: 15px; align-items: center; justify-content: flex-end; }
.mode-indicator { font-size: 10px; color: var(--muted); line-height: 1.4; }
.mode-indicator::before { content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 6px; background: var(--cyan); vertical-align: 2px; }
.sound-toggle { border: 1px solid var(--line); background: transparent; min-width: 37px; min-height: 37px; display: grid; place-items: center; padding: 6px; color: var(--muted); }
.sound-toggle:hover { color: var(--cream); border-color: var(--muted); }
.eyebrow { color: var(--orange); font-size: 10px; letter-spacing: 2.5px; font-weight: 700; text-transform: uppercase; margin-bottom: 19px; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 7px; height: 7px; background: currentColor; box-shadow: 3px 3px 0 #f7a35b25; }
.hero { display: grid; grid-template-columns: 1.22fr 1fr; align-items: center; gap: 24px; padding: 76px 0 62px; min-height: 478px; }
.hero-copy { position: relative; z-index: 1; }
.hero-title { font-size: clamp(39px, 4.7vw, 63px); font-weight: 900; letter-spacing: -4px; line-height: 1.06; margin-bottom: 24px; }
.hero-title .outline-word { color: var(--orange); }
.hero-subtitle { max-width: 420px; font-size: 14px; line-height: 1.9; color: var(--muted); margin-bottom: 26px; }
.hero-copy .button { margin: 2px 8px 4px 0; }
.hero-art { position: relative; display: grid; place-items: center; min-height: 310px; }
.hero-art::before { content: ""; position: absolute; inset: 20px 0 22px; background-image: linear-gradient(#c396db09 1px, transparent 1px), linear-gradient(90deg,#c396db09 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(ellipse,#000 35%,transparent 71%); }
.turkey-stage { display: grid; place-items: center; width: 100%; position: relative; }
.turkey-stage::after { content: ""; width: 172px; height: 9px; background: #09070c6e; display: block; margin: -6px auto 0; }
.turkey-svg { image-rendering: pixelated; width: min(290px,85%); height: auto; position: relative; filter: drop-shadow(8px 10px 0 #08060c50); animation: turkey-bob 3.5s steps(2,end) infinite; }
.hero-art .pixel-star { position: absolute; color: var(--orange); font-size: 23px; }
.hero-art .pixel-star:nth-of-type(1) { top: 26px; right: 56px; }
.hero-art .pixel-star:nth-of-type(2) { left: 35px; top: 85px; color: var(--cyan); font-size: 15px; }
.hero-art .pixel-star:nth-of-type(3) { right: 33px; bottom: 57px; font-size: 12px; }
.hero-art .badge { position: absolute; bottom: 13px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--muted); border-color: var(--line); letter-spacing: 1.5px; font-size: 9px; }
.hero-stats { display: flex; gap: 29px; padding-top: 25px; margin-top: 24px; border-top: 1px solid var(--line); width: fit-content; max-width: 100%; }
.hero-stat { display: flex; flex-direction: column; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.hero-stat strong { color: var(--cream); font-family: var(--display); font-size: 23px; font-weight: 900; letter-spacing: -1px; line-height: 1.4; }
.section-heading { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; margin: 6px 0 27px; }
.section-title { margin: 0 0 9px; font-size: 25px; font-weight: 900; letter-spacing: -1px; }
.section-subtitle { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.8; }
.section-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 12px 21px; text-decoration: none; border: 2px solid var(--line); background: var(--panel-light); color: var(--cream); box-shadow: 3px 3px 0 #09070e; font-size: 11px; font-weight: 700; line-height: 1.45; text-align: center; transition: transform 100ms, background 100ms; }
.button:hover { transform: translate(-1px,-1px); border-color: var(--muted); }
.button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #09070e; }
.button.primary { background: var(--orange); color: #21131c; border-color: var(--orange); box-shadow: 3px 3px 0 var(--orange-dark); }
.button.primary:hover { background: #ffb77d; border-color: #ffb77d; }
.button.secondary { background: transparent; }
.button.small { min-height: 35px; padding: 8px 12px; font-size: 10px; }
.button.danger { background: transparent; color: var(--red); border-color: #7e494f; }
.button.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); box-shadow: 3px 3px 0 #a77a38; }
.button.wide { width: 100%; }
.pack-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 21px; }
.pack-card { border: 1px solid var(--line); background: var(--panel); position: relative; transition: border-color 130ms, transform 130ms; display: flex; flex-direction: column; overflow: hidden; }
.pack-card:hover { border-color: #83617d; transform: translateY(-3px); }
.pack-card::after { content: ""; position: absolute; width: 6px; height: 6px; bottom: 0; right: 0; background: var(--ink); box-shadow: 1px 1px 0 1px var(--ink); }
.pack-art { position: relative; min-height: 138px; display: grid; place-items: center; color: var(--orange); background: #362235; border-bottom: 1px solid var(--line); font-size: 53px; isolation: isolate; }

.burrow-star { position:absolute; display:block; width:2px; height:2px; background:#ebdeca; box-shadow:0 0 7px #ffefc580; animation:burrow-twinkle var(--twinkle,3s) steps(2,end) infinite alternate; }
.burrow-world { position:absolute; left:0; right:0; top:0; height:calc(100% + 3500px); transform:translateY(calc(-1 * var(--camera-y))); will-change:transform; }
.burrow-forest { position:absolute; left:-5%; right:-5%; top:0; height:var(--surface-y); overflow:hidden; }
.burrow-tree { position:absolute; bottom:4px; width:var(--tree-w); height:var(--tree-h); background:currentColor; clip-path:polygon(45% 0,56% 0,56% 9%,72% 9%,72% 23%,86% 23%,86% 39%,100% 39%,100% 51%,80% 51%,80% 62%,99% 62%,99% 74%,62% 74%,62% 100%,42% 100%,42% 76%,0 76%,0 63%,17% 63%,17% 51%,0 51%,0 39%,16% 39%,16% 24%,30% 24%,30% 10%,45% 10%); }

.near-forest { color:#181626; }

.council-hut { position:absolute; left:13%; top:calc(var(--surface-y) - 118px); width:150px; height:120px; }

.hut-roof { position:absolute; top:1px; left:0; width:150px; height:50px; background:#181724; clip-path:polygon(40% 0,60% 0,60% 10%,72% 10%,72% 25%,84% 25%,84% 40%,92% 40%,92% 60%,100% 60%,100% 100%,0 100%,0 62%,10% 62%,10% 43%,24% 43%,24% 27%,38% 27%); }
.hut-window { position:absolute; right:30px; top:56px; width:23px; height:25px; border:5px solid #1a1521; background:#f6c66c; box-shadow:0 0 35px #ffd16b66; }
.hut-door { position:absolute; left:34px; bottom:0; width:24px; height:45px; background:#16121f; }
.council-hut>span { position:absolute; left:25px; top:31px; width:101px; text-align:center; font:700 8px/1.8 monospace; letter-spacing:1px; color:#d6bc91; background:#241d2d; }
.burrow-ground { position:absolute; top:var(--surface-y); left:0; right:0; height:3500px; background:#241c29; border-top:9px solid #514650; }
.ground-grass { position:absolute; left:0; right:0; top:-16px; height:10px; background:repeating-linear-gradient(90deg,#697764 0 17px,#444b47 17px 21px,#899272 21px 24px,#485649 24px 39px); box-shadow:0 4px 0 #252933; }
.soil-layer { position:absolute; left:0; right:0; background-size:78px 92px; }
.soil-loam { top:0; height:650px; background-color:#3d2a2b; background-image:linear-gradient(0deg,transparent 95%,#251d2b 95%),linear-gradient(90deg,transparent 95%,#98674a11 95%); }
.soil-shale { top:650px; height:750px; background-color:#2d2332; background-image:linear-gradient(0deg,transparent 96%,#10122566 96%),linear-gradient(110deg,transparent 91%,#9b698c14 91%); border-top:8px solid #161726; }
.soil-amethyst { top:1400px; height:850px; background-color:#201d35; background-image:linear-gradient(0deg,transparent 94%,#5b4b6c30 94%),linear-gradient(90deg,transparent 96%,#8b74b618 96%); border-top:11px solid #151528; }
.soil-abyss { top:2250px; bottom:0; background-color:#111629; background-image:linear-gradient(0deg,transparent 95%,#29314f66 95%),linear-gradient(90deg,transparent 97%,#a78cdf12 97%); border-top:10px solid #0d1320; }
.burrow-root { position:absolute; display:block; width:25px; height:var(--root-h); border-left:3px solid #a4764b77; border-bottom:3px solid #8c62484d; transform:rotate(var(--root-turn)); clip-path:polygon(0 0,100% 0,100% 100%,0 100%); }
.burrow-root::after { content:""; position:absolute; top:31%; left:0; width:27px; height:36px; border-bottom:2px solid #9f744b7a; transform:rotate(-35deg); }
.burrow-crystal { position:absolute; width:var(--gem-size); height:calc(var(--gem-size) * 2); background:#77d5c4; clip-path:polygon(50% 0,100% 30%,83% 80%,50% 100%,15% 78%,0 28%); filter:drop-shadow(0 0 8px #77e5cd); animation:burrow-glimmer 3s ease-in-out var(--gem-delay) infinite alternate; }
.burrow-crystal.crystal-1 { background:#b0a0e5; filter:drop-shadow(0 0 8px #bc96e5); transform:rotate(22deg); }
.burrow-crystal.crystal-2 { background:#e8bb74; filter:drop-shadow(0 0 8px #e8bb74); transform:rotate(-18deg); }
.burrow-tunnel { position:absolute; left:calc(50% - 82px); top:-10px; width:164px; height:100%; background:repeating-linear-gradient(0deg,#080b1260 0 58px,#080b1248 58px 65px); border-left:6px solid #090a112e; border-right:6px solid #090a112e; clip-path:polygon(9% 0,90% 0,96% 4%,91% 9%,100% 14%,92% 21%,97% 28%,88% 34%,96% 42%,91% 53%,98% 62%,90% 76%,98% 85%,91% 100%,8% 100%,0 85%,8% 72%,1% 61%,9% 48%,0 36%,7% 24%,0 13%); }
.ancient-tablet { position:absolute; color:#b5a8b04d; font:700 12px/1.8 monospace; letter-spacing:3px; padding:20px; border:4px solid #11152255; }
.tablet-one { top:1250px; left:12%; transform:rotate(-3deg); }
.tablet-two { top:2460px; right:10%; transform:rotate(3deg); color:#9b9cca55; }
.burrow-depth-haze { position:absolute; inset:0; z-index:1; background:#050913; opacity:var(--depth-shade); }
.burrow-vignette { position:absolute; inset:0; z-index:4; box-shadow:inset 0 0 160px 45px #09091470; pointer-events:none; }
.arcade-avatar { position:absolute; left:50%; top:55%; width:116px; height:116px; transform:translate(-50%,-100%); z-index:6; }
.arcade-avatar .turkey-svg { width:116px; height:116px; filter:drop-shadow(4px 7px 0 #07081277); animation:none; }
.turkey-motion { position:relative; z-index:2; transform-origin:50% 100%; animation:burrow-idle 2.2s steps(2,end) infinite; }
.turkey-aura { position:absolute; inset:-22px; border-radius:50%; background:radial-gradient(ellipse,#e8b77916,transparent 69%); }
.turkey-footsteps { position:absolute; bottom:0; left:35px; width:52px; height:14px; z-index:3; opacity:0; }
.turkey-footsteps i { position:absolute; width:18px; height:7px; background:#f6b96b; box-shadow:4px 4px 0 #80553a; }
.turkey-footsteps i:nth-child(2) { right:0; }
.turkey-dust { position:absolute; left:50%; bottom:0; width:1px; height:1px; }
.turkey-dust i { position:absolute; width:5px; height:5px; background:var(--dust-color); opacity:0; }
.gold-sparkles { position:absolute; inset:0; z-index:3; pointer-events:none; }
.gold-sparkles i { position:absolute; left:50%; top:50%; width:5px; height:5px; background:#fff1a8; box-shadow:0 0 12px #ffd36e; opacity:0; }
.arcade-scene.is-descending .turkey-motion { animation:burrow-trot .16s steps(2,end) infinite; }
.arcade-scene.is-descending .turkey-footsteps { opacity:1; }
.arcade-scene.is-descending .turkey-footsteps i { animation:burrow-foot .16s steps(2,end) infinite alternate; }
.arcade-scene.is-descending .turkey-footsteps i:nth-child(2) { animation-delay:-.08s; }
.arcade-scene.is-descending .turkey-dust i { animation:burrow-dust .5s ease-out var(--dust-delay) infinite; }
.arcade-avatar.is-gold .turkey-svg,.arcade-scene.is-gold .arcade-avatar .turkey-svg { filter:sepia(.8) saturate(2.2) hue-rotate(2deg) brightness(1.25) drop-shadow(0 0 12px #ffdc6599); }
.arcade-scene.is-gold .turkey-aura { background:radial-gradient(ellipse,#ffe99565,transparent 70%); animation:burrow-gold-aura 1.8s ease-in-out infinite alternate; }
.arcade-scene.is-gold .gold-sparkles i { animation:burrow-gold-spark 1.4s ease-out var(--spark-delay) infinite; }
.burrow-impact { position:absolute; left:50%; top:48%; width:10px; height:10px; border:4px solid #ffe79a; opacity:0; transform:translate(-50%,-50%); z-index:5; pointer-events:none; }
.gold-burst .burrow-impact { animation:burrow-shockwave 1.1s ease-out forwards; }
.burrow-rails { position:absolute; inset:0; z-index:5; opacity:0; visibility:hidden; }
.burrow-rank-rail { position:absolute; left:16%; right:15%; top:var(--rail-y); display:flex; gap:9px; align-items:center; color:var(--rank-color); transform:translateY(30px); opacity:0; }
.is-descending .burrow-rank-rail,.is-settled .burrow-rank-rail { opacity:.3; transform:translateY(0); transition:opacity .22s,transform .4s; }
.rail-rule { height:1px; flex:1; border-top:1px dashed currentColor; }
.rail-label { font:700 9px/1.4 monospace; letter-spacing:1.2px; white-space:nowrap; }
.rail-label b { margin-left:8px; font-weight:700; }
.rail-symbol { font-size:13px; }
.burrow-rank-rail.is-passed { opacity:1; filter:drop-shadow(0 0 7px var(--rank-color)); }
.burrow-rank-rail.is-passed .rail-rule { border-top-style:solid; height:2px; box-shadow:0 0 11px var(--rank-color); }
.burrow-rank-rail.is-winning { opacity:1; transform:scale(1.015); filter:drop-shadow(0 0 9px var(--rank-color)); }

.burrow-side-scale { position:absolute; top:7%; bottom:8%; right:0; width:62px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid #acb7d62e; z-index:7; font:9px monospace; color:#c3c5dc88; }
.burrow-side-scale span { display:block; text-align:right; padding-right:9px; position:relative; }
.burrow-side-scale span::after { content:""; position:absolute; right:0; top:4px; height:1px; width:6px; background:#c3c5dc55; }
.burrow-coordinates { position:absolute; bottom:15px; left:25px; right:25px; display:flex; justify-content:space-between; gap:12px; z-index:8; color:#ada9c9a1; font:8px monospace; letter-spacing:2px; }
.burrow-hud { position:absolute; top:24px; left:32px; right:32px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; z-index:10; }
.burrow-hud .hud-stat { min-width:112px; padding:12px 17px; border:1px solid #798aab66; background:#101325ec; box-shadow:4px 4px 0 #080b165e; }
.hud-stat small { display:block; font-size:9px; letter-spacing:3px; color:#aeb8d0; }
.hud-stat strong { display:block; font-family:var(--display); font-size:27px; line-height:1.35; color:#7ee3e1; text-shadow:0 0 15px #69f5e344; }
.hud-stat:last-child strong { color:#f6b3ce; }
.burrow-progress { display:flex; gap:5px; align-items:center; justify-content:center; margin-top:5px; }
.burrow-progress span { width:15px; height:15px; background:#131426; border:1px solid #7e87a777; font-size:9px; text-align:center; }
.burrow-progress span.done { background:#86d1c4; color:#101325; }
.burrow-progress span.current { background:#f1aa77; box-shadow:0 0 13px #f1aa7770; }
.burrow-progress-label { font:9px monospace; letter-spacing:2px; color:#c5c3db; text-align:center; margin-top:8px; }
.burrow-prompt { position:absolute; top:20%; left:50%; transform:translateX(-50%); width:min(570px,calc(100% - 150px)); text-align:center; padding:21px 26px; background:#101224ed; border:1px solid #68627b88; box-shadow:5px 5px 0 #05091555; z-index:8; }
.burrow-prompt .eyebrow { justify-content:center; margin-bottom:12px; font-size:9px; }
.burrow-prompt h1,.burrow-prompt h2 { margin:0; font-size:clamp(17px,2.2vw,25px); line-height:1.5; letter-spacing:0; overflow-wrap:anywhere; }
.burrow-prompt p { font-size:11px; margin:9px 0 0; color:#a8a4c3; }
.burrow-controls { position:absolute; bottom:47px; left:50%; transform:translateX(-50%); width:min(650px,calc(100% - 105px)); z-index:10; }
.burrow-controls form { display:flex; align-items:center; gap:10px; }
.burrow-controls .answer-input { flex:1; width:0; min-width:0; border:2px solid #75d9dc; background:#101525f2; padding:15px 18px; font-size:17px; min-height:58px; color:#fff4df; box-shadow:0 4px 0 #195765; }
.burrow-controls .answer-input:focus { outline:2px solid #c9ffff; outline-offset:3px; }
.burrow-controls .button { min-height:58px; margin:0; background:#f59bbe; border-color:#f59bbe; color:#261a2e; box-shadow:0 4px 0 #965372; font-size:12px; letter-spacing:2px; }
.burrow-controls .timer { min-width:45px; width:45px; height:45px; font-size:19px; display:grid; place-items:center; border:2px solid #70d6da; color:#8de7ea; background:#102232e8; box-shadow:0 0 0 4px #17202f,0 0 0 5px #70d6da55; }
.burrow-controls .hint { margin:14px 0 0; text-align:center; color:#cdc5d8; font-size:10px; text-shadow:0 1px #0a1020; }
.burrow-controls .timer-track { margin-top:13px; height:3px; background:#152c3a; }
.burrow-controls .timer-fill { height:3px; background:#7ce0df; }
.burrow-invalid { color:#ffc289; background:#1c1625ed; text-align:center; padding:7px 12px; font-size:12px; margin-bottom:12px; border-left:2px solid #ffb57c; }
.burrow-invalid:not(:empty) { animation:burrow-reject .22s steps(2,end); }
.burrow-reveal { position:absolute; z-index:9; top:25%; left:50%; transform:translateX(-50%); width:min(650px,calc(100% - 120px)); text-align:center; color:#fff3dd; }
.burrow-reveal .reveal-rank { display:block; color:var(--tier-color,#8ddbd2); font:bold clamp(18px,3vw,31px)/1.4 var(--display); letter-spacing:2px; text-shadow:0 0 23px currentColor; }
.burrow-reveal .reveal-answer { font-size:21px; margin:13px 0; font-weight:700; overflow-wrap:anywhere; }
.burrow-reveal .reveal-points { font-size:17px; color:#e1c78e; margin-bottom:13px; }
.burrow-reveal .reveal-explanation { color:#c5bfd1; line-height:1.8; font-size:12px; max-width:520px; margin:0 auto; }
.burrow-reveal.is-gold .reveal-rank { color:#ffe38b; text-shadow:0 0 12px #ffd96188,0 0 35px #ffc85766; }
.burrow-reveal .button { margin-top:22px; }
.burrow-run-mode { position:absolute; left:18px; bottom:17px; z-index:10; font-size:8px; color:#c3b4d1; letter-spacing:1px; }
.burrow-leave { position:absolute; top:110px; left:24px; z-index:11; border:1px solid #7e7a9b55; color:#d2c9dc; padding:6px 10px; background:#11152ab3; font:10px monospace; }
@keyframes burrow-twinkle { to{opacity:.25} }
@keyframes burrow-glimmer { to{opacity:.4;filter:brightness(.7) drop-shadow(0 0 3px #a5c7d4)} }
@keyframes burrow-idle { 50%{transform:translateY(-3px) rotate(-1deg)} }
@keyframes burrow-trot { 0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(7deg)} }
@keyframes burrow-foot { to{transform:translateY(-7px) translateX(8px)} }
@keyframes burrow-dust { 15%{opacity:1}100%{opacity:0;transform:translate(var(--dust-x),var(--dust-y)) rotate(90deg)} }
@keyframes burrow-gold-aura { to{transform:scale(1.14);opacity:.65} }
@keyframes burrow-gold-spark { 15%{opacity:1}100%{transform:translate(var(--spark-x),var(--spark-y)) rotate(90deg);opacity:0} }
@keyframes burrow-shockwave { 5%{opacity:1}100%{width:550px;height:550px;opacity:0;transform:translate(-50%,-50%) rotate(45deg)} }
@keyframes burrow-reject { 25%{transform:translateX(-7px)}75%{transform:translateX(7px)} }
@media(max-width:700px){
 .arcade-shell{margin:15px 0 25px;min-height:650px;height:calc(100svh - 110px)}
 .burrow-hud{top:16px;left:15px;right:15px;gap:8px}.burrow-hud .hud-stat{min-width:80px;padding:9px 11px}.hud-stat strong{font-size:21px}.hud-stat small{font-size:8px;letter-spacing:2px}
 .burrow-progress{gap:3px}.burrow-progress span{width:11px;height:12px;font-size:8px}.burrow-progress-label{font-size:8px;letter-spacing:1px}
 .burrow-prompt{top:22%;width:calc(100% - 65px);padding:17px}.burrow-prompt h1,.burrow-prompt h2{font-size:19px}
 .burrow-controls{width:calc(100% - 34px);bottom:47px}.burrow-controls form{gap:8px}.burrow-controls .answer-input{font-size:16px;padding:13px 11px;min-height:53px}.burrow-controls .button{padding:12px;min-height:53px;font-size:10px;letter-spacing:1px}.burrow-controls .timer{width:35px;min-width:35px;height:35px;font-size:16px}
 .burrow-reveal{top:23%;width:calc(100% - 58px)}.burrow-reveal .reveal-answer{font-size:19px}.burrow-reveal .reveal-explanation{font-size:11px}
 .burrow-side-scale{width:40px;font-size:8px;opacity:.55}.burrow-rank-rail{left:6%;right:6%}.rail-label{font-size:8px;letter-spacing:.4px}.rail-label b{margin-left:4px}
 .council-hut{left:5%;transform:scale(.7);transform-origin:left bottom}.arcade-avatar,.arcade-avatar .turkey-svg{width:100px;height:100px}.tablet-one{left:4%;font-size:9px}.tablet-two{right:5%;font-size:9px}
 .burrow-coordinates{left:14px;right:14px;font-size:7px;letter-spacing:.5px}.burrow-coordinates>span:first-child{display:none}.burrow-coordinates{justify-content:flex-end}.burrow-leave{left:15px;top:91px}
}
@media(prefers-reduced-motion:reduce){
 .arcade-shell *, .arcade-shell *::before,.arcade-shell *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
 .arcade-scene.is-gold .gold-sparkles i{opacity:.5;transform:translate(calc(var(--spark-x) * .45),calc(var(--spark-y) * .45))}
 .is-descending .turkey-footsteps,.is-descending .turkey-dust{display:none}
}
/* Main app integration: gameplay is a world, rather than a card inside a page. */
.playing-arcade { background:#121121; }
.playing-arcade .topbar { min-height:65px; padding:9px 24px; gap:25px; margin:0; width:100%; background:#121120; border-bottom:1px solid #605071; }

.playing-arcade .brand-subtitle { display:none; }
.playing-arcade .brand-icon { width:30px; height:30px; }
.playing-arcade .footer { display:none; }
.playing-arcade main.container { width:100%; max-width:none; padding:0; }
.playing-arcade .arcade-shell { border:0; margin:0; min-height:640px; height:calc(100svh - 65px); max-height:none; box-shadow:none; }
.playing-arcade main>.error-message { position:absolute; top:70px; left:15%; right:15%; z-index:30; }
.burrow-meter { min-width:112px; padding:11px 17px; border:1px solid #798aab66; background:#101325ec; box-shadow:4px 4px 0 #080b165e; clip-path:polygon(7px 0,calc(100% - 7px) 0,calc(100% - 7px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 7px) calc(100% - 4px),calc(100% - 7px) 100%,7px 100%,7px calc(100% - 4px),0 calc(100% - 4px),0 4px,7px 4px); }
.burrow-meter>span { display:block; color:#b8b7d3; font-size:9px; letter-spacing:3px; }
.burrow-meter>strong { display:block; font:bold 27px/1.3 var(--display); color:#86e3e3; text-shadow:0 0 16px #8ee5e840; }
.burrow-meter>strong small { font-size:15px; margin-left:3px; }
.score-meter>strong { color:#ffb8d6; }
.burrow-hud-center { text-align:center; max-width:45%; }
.burrow-hud-center>span { display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#eee6f3; overflow-wrap:anywhere; }
.burrow-hud-center>small { display:block; font-size:8px; letter-spacing:1.3px; margin-top:9px; color:#adaacb; }
.burrow-input-row { display:flex; gap:12px; align-items:center; }
.burrow-input-row .timer { display:flex; flex-direction:column; justify-content:center; gap:2px; }
.burrow-input-row .timer small { font-size:7px; letter-spacing:1px; color:#bed7e3; }
.burrow-feedback { min-height:26px; font-size:11px; letter-spacing:.6px; text-align:center; color:#e5d1bd; margin-bottom:10px; text-shadow:0 1px 3px #070a14; }
.answer-rejected .burrow-feedback { color:#ffc489; background:#181221dd; padding:6px 9px; animation:burrow-reject .22s steps(2,end); }
.answer-rejected .answer-input { border-color:#ffb681; box-shadow:0 4px 0 #755044; }
.burrow-controls>p { text-align:center; margin:15px 0 0; color:#c5bdd2; font-size:10px; letter-spacing:.4px; }
.burrow-controls.reveal-controls { text-align:center; }
.reveal-controls .button { min-width:280px; background:#81d9dd; border-color:#81d9dd; box-shadow:0 4px 0 #2b656e; }
.burrow-reveal { top:20%; }
.burrow-reveal .eyebrow { justify-content:center; font-size:clamp(17px,2.8vw,29px); letter-spacing:3px; color:var(--tier-color,#85d6d1); text-shadow:0 0 20px currentColor; margin-bottom:10px; }
.burrow-reveal .eyebrow::before { display:none; }
.burrow-reveal h1 { font-size:clamp(19px,2vw,25px); letter-spacing:0; line-height:1.45; margin-bottom:13px; }
.burrow-award { display:block; font-size:18px; color:#f2d89e; margin-bottom:14px; }
.burrow-award>span { font-size:13px; color:#b8c9da; }
.burrow-reveal .burrow-explanation { margin:0 auto 10px; max-width:510px; max-height:105px; overflow:auto; font-size:12px; line-height:1.7; color:#d2c8dc; }
.burrow-reveal>p:last-child { font-size:10px; letter-spacing:2px; color:#bdb4d0; }
.burrow-caption { position:absolute; bottom:15px; left:25px; z-index:10; color:#b7afc8; font-size:8px; letter-spacing:1px; }
.burrow-reveal.is-gold .eyebrow { color:#ffe18c; text-shadow:0 0 12px #ffdb8580,0 0 35px #ffd57550; }
.burrow-reveal.is-gold .burrow-award { color:#ffe29d; }

  <script>
/* Councillion: dependency-free browser client and an explicitly local host mode. */
(function (root) {
  'use strict';
  const TIERS = Object.freeze([
    { id: 'councillion', name: 'One in a Councillion', points: 100, color: '#f5cc62' },
    { id: 'grimkyle', name: 'Grimkyle', points: 85, color: '#d3a1ff' },
    { id: 'donovan', name: 'Donovan', points: 60, color: '#ee9f88' },
    { id: 'cavaughn', name: 'Cavaughn', points: 30, color: '#85cbd0' },
    { id: 'kalen', name: 'Kalen', points: 15, color: '#a9c990' },
    { id: 'dino', name: 'Dino', points: 10, color: '#b7afb6' }
  ]);
  const uuid = () => root.crypto?.randomUUID?.() || 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const n = Math.random() * 16 | 0; return (c === 'x' ? n : (n & 3 | 8)).toString(16); });
  const clone = x => JSON.parse(JSON.stringify(x));
  const normalize = x => String(x || '').normalize('NFKD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  // Bounded edit distance: 0 = equal, 1 = one edit, 2 = too different.
  // A swap of adjacent letters counts as one edit (appel -> apple).
  function typoDistance(left, right) {
    if (left === right) return 0;
    const a = Array.from(left), b = Array.from(right);
    if (Math.abs(a.length - b.length) > 1) return 2;
    let i = 0;
    while (i < Math.min(a.length, b.length) && a[i] === b[i]) i++;
    if (a.length === b.length) {
      if (a.slice(i + 1).join('') === b.slice(i + 1).join('')) return 1;
      if (i + 1 < a.length && a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2).join('') === b.slice(i + 2).join('')) return 1;
      return 2;
    }
    const short = a.length < b.length ? a : b, long = a.length < b.length ? b : a;
    return short.slice(i).join('') === long.slice(i + 1).join('') ? 1 : 2;
  }
  function matchAnswer(raw, answers) {
    const n = normalize(raw);
    if (!n) return null;
    const exact = answers.find(a => [a.canonical, ...(a.aliases || [])].some(s => normalize(s) === n));
    if (exact) return exact;
    if (Array.from(n).length < 4) return null;
    const candidates = [];
    for (const answer of answers) {
      const spellings = [answer.canonical, ...(answer.aliases || [])].map(normalize).filter(s => typoDistance(n, s) === 1);
      if (spellings.length) candidates.push({ answer, eligible: spellings.some(s => Array.from(s).length >= 5) });
    }
    // Count short-name competitors too; several aliases of one answer count once.
    return candidates.length === 1 && candidates[0].eligible ? candidates[0].answer : null;

er.</p></div><div class="answer-search-toolbar"><label class="field" for="answer-search">SEARCH THE ANSWER ARCHIVE<input id="answer-search" class="input" type="search" placeholder="Search answers, ranks or explanations…" value="${e(S.search)}" autocomplete="off"></label><span id="answer-search-count" role="status" aria-live="polite"></span></div><div class="result-list">${rows.map((q,i) => resultCard(q,i)).join('')}</div></section><div class="section-actions results-bottom"><button class="button primary" data-action="replay" data-id="${e(r.packId)}">REPLAY PACK ↻</button>${r.isOfficial===false?`<button class="button secondary" data-action="official-results" data-id="${e(r.officialAttemptId)}">VIEW FIRST-RUN RESULTS</button>`:''}<button class="button secondary" data-action="packs">BACK TO PACKS →</button></div>`;

  function openDialog(name) { S.lastFocus=document.activeElement;S.dialog=name;renderDialog(); }

  async function run(task, {rerender=true,keepDialog=false}={}) {
    if(S.busy)return;
    S.busy=true;S.error='';S.notice='';
    try { await task(); }
    catch(err) { S.error=err?.message||'Something went wrong. Please try again.';if(S.dialog){if(keepDialog){const status=dialogRoot.querySelector('[data-import-status]');if(status){status.textContent=S.error;status.classList?.add('is-error');}}else closeDialog();} }
    finally { S.busy=false;if(rerender||(keepDialog&&!S.dialog)){if(!S.preserveQuestion||!patchQuestionFeedback())render();S.preserveQuestion=false;} }
  }
  async function refreshPacks() { S.packs=await api.listPacks(); }
  async function navigate(screen) {
    if(S.screen==='game'&&screen!=='game') {
      const active=S.game?.status==='active';
      if(active&&!window.confirm('Leaving uses up this question. When you return, it will score zero and you will continue with the next one. Leave?'))return;
    }
    S.error='';S.notice='';S.screen=screen;
    if(screen==='home'||screen==='packs')await refreshPacks();

  async function play(packId) {
    if(!S.profile?.username){S.afterName=()=>play(packId);openDialog('username');return;}
    S.invalid='';S.suggestion=null;
    const existing=S.packs.find(p=>p.id===packId)?.myAttempt;
    if(existing && existing.status!=='completed'){
      const interrupted=await api.getState(existing.id);
      S.game=await api.resume(interrupted.id,interrupted.question?.id||null);
    }else S.game=await api.begin(packId);
    syncClock();
    if(S.game.status==='completed'){await showResults(S.game.id);return;}
    S.screen='game';S.timerRequest=false;render();window.scrollTo({top:0,behavior:'instant'});
  }
  function syncClock() { S.clockOffset=Number(S.game?.serverNow || Date.now())-Date.now(); }
  async function replay(packId) {
    S.invalid='';S.suggestion=null;S.game=await api.practice(packId,newId());syncClock();S.screen='game';S.timerRequest=false;render();window.scrollTo({top:0,behavior:'instant'});
  }
  async function resumePractice(id) {
    const interrupted=await api.getState(id);
    S.invalid='';S.suggestion=null;S.game=await api.resume(id,interrupted.question?.id||null);syncClock();S.timerRequest=false;
    if(S.game.status==='completed'){await showResults(id);return;}
    S.screen='game';render();window.scrollTo({top:0,behavior:'instant'});

  async function showResults(id) {
    S.results=await api.getResults(id);S.screen='results';S.search='';
    writeStore('councillion.lastAttempt',id);
    if((S.results.questions||[]).some(q=>Number(q.points)===100)){beep(true);celebrate();}else beep(false);
    await refreshPacks();
  }
  async function lockAnswer(text, confirmed=false) {
    if(!S.game?.question)return;
    const before=S.game,questionId=before.question.id;
    const requestKey=`councillion.request.${before.id}.${questionId}`;
    const saved=readStore(requestKey,'');let requestId;
    try{const pending=JSON.parse(saved);requestId=pending.text===text&&!!pending.confirmed===confirmed?pending.id:null;}catch(_){}
    requestId=requestId||newId();writeStore(requestKey,JSON.stringify({id:requestId,text,confirmed}));
    S.game=await api[confirmed?'confirmAnswer':'answer'](before.id,questionId,text,requestId);syncClock();S.timerRequest=false;
    try{localStorage.removeItem(requestKey);}catch(_){}
    S.suggestion=null;
    if(S.game.feedback?.kind==='suggestion'){
      S.suggestion={raw:text,candidate:S.game.feedback.candidate};S.invalid='';
      writeStore(`councillion.draft.${before.id}.${questionId}`,text);
      S.preserveQuestion=true;window.CouncilArcade?.sound('suggest');return;
    }
    if(S.game.feedback?.kind==='invalid'){
      S.invalid=S.game.feedback.message||`"${text}" is invalid. Try again.`;
      writeStore(`councillion.draft.${before.id}.${questionId}`,text);
      S.preserveQuestion=true;window.CouncilArcade?.sound('reject');return;
    }
    S.invalid='';try{localStorage.removeItem(`councillion.draft.${before.id}.${questionId}`);}catch(_){}
    const last=S.game.lastAnswer||S.game.history?.at(-1);
    S.animationFrom=Number(before.runScore||0);S.animationGoldBefore=!!before.hasCouncillion;S.animating=true;
    try{
      app.querySelector?.('.game-topbar')?.setAttribute('inert','');
      await window.CouncilArcade?.dismissQuestion?.();
      render();
      if(last?.points>0)await window.CouncilArcade?.descend({fromScore:S.animationFrom,toScore:Number(S.game.runScore||0),tier:last.tier,gold:last.points===100,explanation:last.explanation,canonical:last.canonical});
      else await window.CouncilArcade?.miss();
    }finally{S.animating=false;}
    // The seventh reveal remains visible until the player chooses results.
  }
  function updateTimer() {
    if(S.screen!=='game'||!S.game?.question||!S.game.deadline)return;
    const left=Math.max(0,Number(S.game.deadline)-(Date.now()+S.clockOffset));
    const value=document.getElementById('timer-value');
    if(value){value.textContent=String(Math.ceil(left/1000)).padStart(2,'0');value.parentElement.classList.toggle('urgent',left<=5000);}
    const fill=document.getElementById('timer-fill');if(fill)fill.style.width=`${Math.min(100,left/25000*100)}%`;
    if(left<=0&&!S.busy&&!S.timerRequest){S.timerRequest=true;run(async()=>{await lockAnswer('');}).then(()=>{if(S.error)S.timerRequest=false;});}
  }
  function beep(gold=false) {
    if(!S.sound)return;
    try{const context=new(window.AudioContext||window.webkitAudioContext)();const notes=gold?[523,659,784,1047]:[392,523];notes.forEach((freq,i)=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type='square';oscillator.frequency.value=freq;gain.gain.setValueAtTime(.035,context.currentTime+i*.11);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+i*.11+.16);oscillator.connect(gain);gain.connect(context.destination);oscillator.start(context.currentTime+i*.11);oscillator.stop(context.currentTime+i*.11+.17);});setTimeout(()=>context.close(),1000);}catch(_){}
  }
  function celebrate() {
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const confetti=document.createElement('div');confetti.className='confetti';confetti.setAttribute('aria-hidden','true');confetti.innerHTML=Array.from({length:32},(_,i)=>`<i style="--x:${(i*37)%100}%;--delay:${(i%7)*.07}s;--rotation:${i*29}deg"></i>`).join('');document.body.append(confetti);setTimeout(()=>confetti.remove(),2600);
  }
  async function savePack(published) {
    syncEditor();const pack=JSON.parse(JSON.stringify(S.editor));pack.published=published;
    pack.questions.forEach(q=>{q.answers=q.answers.filter(a=>a.canonical.trim());});
    if(!pack.title.trim())throw new Error('Give your pack a title before saving.');
    if(published){for(let i=0;i<7;i++){const q=pack.questions[i];if(!q?.prompt.trim())throw new Error(`Question ${i+1} needs its question text.`);if(!q.answers.length)throw new Error(`Question ${i+1} needs at least one accepted answer.`);if(q.answers.some(a=>a.tier==='councillion'&&!a.explanation?.trim()))throw new Error(`Question ${i+1}: give each Councillion answer an explanation.`);}}
    S.editor=await api.adminSave(pack);S.savedAnswerIds=new Set(S.editor.questions.flatMap(q=>q.answers.map(a=>a.id)));S.notice=published?'Pack published. The Council is ready.':'Draft saved. Keep making it yours.';await refreshPacks();
  }
  function syncEditor() {
    if(!S.editor)return;
    document.querySelectorAll('[data-pack-field]').forEach(input=>S.editor[input.dataset.packField]=input.value);
    const q=S.editor.questions[S.editorQuestion];
    document.querySelectorAll('[data-question-field]').forEach(input=>q[input.dataset.questionField]=input.value);
    document.querySelectorAll('[data-answer-field]').forEach(input=>{const answer=q.answers[Number(input.dataset.answerIndex)];if(!answer)return;answer[input.dataset.answerField]=input.dataset.answerField==='aliases'?input.value.split(',').map(x=>x.trim()).filter(Boolean):input.value;});
  }

  async function exportPack(id) {

  document.addEventListener('click',event=>{

    window.CouncilArcade?.setSound(S.sound);window.CouncilArcade?.unlockAudio();
    if(action==='gobble'){window.CouncilArcade?.gobble();return;}
    if(action==='dismiss-suggestion'){S.suggestion=null;if(!patchQuestionFeedback())render();document.getElementById('answer')?.focus({preventScroll:true});return;}
    if(action==='dialog-backdrop'&&event.target!==button)return;
    if(S.animating&&action!=='gobble')return;
    if(action==='sound'){S.sound=!S.sound;writeStore('councillion.sound',S.sound?'on':'off');window.CouncilArcade?.setSound(S.sound);if(!S.animating)render();return;}
    if(action==='close-dialog'||action==='dialog-backdrop'){closeDialog();return;}
    if(action==='username'){openDialog('username');return;}
    if(action==='settings'){openDialog('settings');return;}
    if(action==='bulk-pack'){openDialog('bulk-pack');return;}
    if(action==='bulk-answers'){syncEditor();openDialog('bulk-answers');return;}
    if(action==='download-text-template'){downloadText('Councillion-pack-template.txt',window.CouncilBulk.textTemplate());return;}
    if(action==='download-template'){downloadText('Councillion-pack-template.csv',window.CouncilBulk.template(),'text/csv');return;}
    if(action==='review-filter'){S.reviewFilter=id==='all'?'all':'unrecognized';render();return;}
    if(action==='new-pack'){S.savedAnswerIds=new Set();S.editor=blankPack();S.editorQuestion=0;S.screen='editor';render();return;}
    if(action==='edit-question'){syncEditor();S.editorQuestion=Number(button.dataset.index);render();return;}
    if(action==='add-answer'){syncEditor();S.editor.questions[S.editorQuestion].answers.push({id:newId(),canonical:'',tier:'dino',aliases:[],explanation:''});render();return;}
    if(action==='remove-answer'){syncEditor();S.editor.questions[S.editorQuestion].answers.splice(Number(button.dataset.index),1);render();return;}
    run(async()=>{
      if(['home','packs','leaderboard','how','admin'].includes(action)){await navigate(action);return;}
      if(action==='confirm-suggestion'){if(S.suggestion)await lockAnswer(S.suggestion.raw,true);return;}
      if(action==='play'){await play(id);return;}
      if(action==='replay'){await replay(id);return;}
      if(action==='resume-practice'){await resumePractice(id);return;}
      if(action==='official-results'){await showResults(id);return;}
      if(action==='finish-results'){await showResults(S.game.id);return;}
      if(action==='next-question'){S.invalid='';S.suggestion=null;await window.CouncilArcade?.prepareNext?.();S.game=await api.startQuestion(S.game.id);syncClock();S.timerRequest=false;return;}
      if(action==='pack-board'||action==='board-select'){S.boardPack=id||'';await navigate('leaderboard');return;}
      if(action==='refresh-results'){await showResults(S.results?.attemptId||S.game?.id||readStore('councillion.lastAttempt',''));return;}
      if(action==='share-results'){const text=`${S.results.username||S.profile?.username} · ${S.results.title}\n${S.results.total}/700 on COUNCILLION${S.results.isOfficial===false?' (REPLAY — not a leaderboard score)':''}\n${(S.results.questions||[]).map(q=>({councillion:'🟨',grimkyle:'🟪',donovan:'🟧',cavaughn:'🟦',kalen:'🟩',dino:'⬜'})[q.tier]||'⬛').join('')}\nTHE COUNCIL HAS SPOKEN.`;try{await navigator.clipboard.writeText(text);S.notice='Score copied. Send it to the Council.';}catch(_){window.prompt('Copy your score:',text);}return;}
      if(action==='edit-pack'){S.editor=await api.adminGet(id);S.savedAnswerIds=new Set(S.editor.questions.flatMap(q=>q.answers.map(a=>a.id)));S.editorQuestion=0;S.screen='editor';return;}
      if(action==='regrade-answer'){syncEditor();const answer=S.editor.questions[S.editorQuestion].answers[Number(button.dataset.index)];await api.adminRegradeAnswer({answerId:answer.id,tier:answer.tier,explanation:answer.explanation||''});S.notice='Rarity correction applied. Historical scores without individual overrides and the leaderboards are updated.';return;}
      if(action==='save-draft'){await savePack(false);return;}
      if(action==='refresh-admin'){await loadAdmin();return;}
      if(action==='publish-pack'||action==='private-pack'){await api.adminVisibility(id,action==='publish-pack');await loadAdmin();await refreshPacks();S.notice=action==='publish-pack'?'Pack is public. Everyone with the website link can play.':'Pack is private. Players cannot start or continue it until you publish it again.';return;}
      if(action==='delete-pack'){const pack=S.adminPacks.find(p=>p.id===id);if(!window.confirm(`Delete “${pack?.title||'this pack'}” from the website? It will stop being playable. Saved results and score history will be retained.`))return;await api.adminDelete(id);await loadAdmin();await refreshPacks();S.notice='Pack deleted from the website. Saved results and score history are retained.';return;}
      if(action==='admin-logout'){await api.adminLogout();S.profile=await api.init();await navigate('admin');return;}
      if(action==='reject-review'){await api.adminReview({submissionId:id,reject:true});await loadAdmin();S.notice='Zero points recorded. Results have been updated.';return;}
      if(action==='export-pack'){await exportPack(id);return;}
      if(action==='disconnect'){await api.disconnect();window.location.reload();return;}
    });
  });
  document.addEventListener('submit',event=>{
    const form=event.target.closest('[data-form]');if(!form)return;event.preventDefault();
    const data=new FormData(form),type=form.dataset.form;
    window.CouncilArcade?.setSound(S.sound);window.CouncilArcade?.unlockAudio();
    const inlineImport=['bulk-pack','bulk-answers'].includes(type);
    run(async()=>{
      if(type==='username'){S.profile=await api.enter(String(data.get('username')).trim());closeDialog();const next=S.afterName;S.afterName=null;if(next)await next();return;}
      if(type==='answer'){await lockAnswer(String(data.get('answer')||'').trim());return;}
      if(type==='admin-login'){S.profile=await api.adminLogin(String(data.get('email')),String(data.get('password')));if(!isAdmin())throw new Error('This account is not an authorized Game Master. Ask the project owner to grant access.');await loadAdmin();return;}
      if(type==='pack-editor'){await savePack(true);return;}
      if(type==='review'){await api.adminReview({submissionId:form.dataset.id,answerId:String(data.get('answerId')||'')||null,reject:false,newAnswer:data.get('answerId')?undefined:{canonical:String(data.get('canonical')),tier:String(data.get('tier')),aliases:[],explanation:String(data.get('explanation')||'')},applyToMatching:true,overridePoints:data.get('overridePoints')===''?null:Number(data.get('overridePoints')),note:String(data.get('note')||'')});await loadAdmin();S.notice='Optional correction saved. Affected results and standings are updated.';return;}
      if(type==='bulk-pack'){importEditor(window.CouncilBulk.parsePack(String(data.get('text')||''),{title:String(data.get('title')||'Imported pack')}));closeDialog();return;}
      if(type==='bulk-answers'){const added=window.CouncilBulk.parseAnswers(String(data.get('text')||''),{defaultTier:String(data.get('tier')||'dino')});const q=S.editor.questions[S.editorQuestion];q.answers=window.CouncilBulk.mergeAnswers(q.answers.filter(a=>a.canonical.trim()),added);closeDialog();S.notice=`Added ${added.length} answers. Assign ranks and save when ready.`;return;}
      if(type==='settings'){await api.configure({url:String(data.get('url')).trim().replace(/\/$/,''),key:String(data.get('key')).trim()});window.location.reload();return;}
    },{rerender:!inlineImport,keepDialog:inlineImport});
  });
  document.addEventListener('input',event=>{
    const input=event.target;
    if(input.id==='answer-search'){S.search=input.value;filterAnswers(S.search);return;}
    if(input.id==='answer'&&S.game?.question){
      writeStore(`councillion.draft.${S.game.id}.${S.game.question.id}`,input.value);
      if(S.suggestion && input.value.trim()!==S.suggestion.raw){S.suggestion=null;document.querySelector('.answer-suggestion')?.remove();const feedback=document.querySelector('.burrow-feedback');if(feedback)feedback.textContent='Think past your first answer.';}
    }
    if(input.hasAttribute('data-pack-field')||input.hasAttribute('data-question-field')||input.hasAttribute('data-answer-field'))syncEditor();
  });
  document.addEventListener('change',event=>{
    const input=event.target;
    if(input.dataset.answerField==='tier'){syncEditor();render();}
    if(input.id==='import-pack'&&input.files[0])run(async()=>{
      const file=input.files[0];if(file.size>1000000)throw new Error('Choose a pack file under 1 MB.');
      const format=/\.csv$/i.test(file.name)?'csv':/\.tsv$/i.test(file.name)?'tsv':'auto';
      importEditor(window.CouncilBulk.parsePack(await file.text(),{title:file.name.replace(/\.(json|csv|tsv|txt)$/i,''),format}));
    });
  });
  document.addEventListener('keydown',event=>{
    if(!S.dialog)return;
    if(event.key==='Escape'){closeDialog();return;}
    if(event.key==='Tab'){const focusables=[...dialogRoot.querySelectorAll('button,input,textarea,select,a[href]')].filter(el=>!el.disabled);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer();});
  setInterval(updateTimer,100);
  async function boot() {
    if(!api){S.error='The game service did not load. Open the complete website folder, or use the standalone Councillion.html file.';render();return;}
    try { S.profile=await api.init();await refreshPacks();if(window.CouncilStorageUnavailable)S.error='Browser storage is blocked. This session cannot preserve progress or packs when you close it. Allow site storage before creating a pack or playing.';if(window.CouncilConfigurationError)S.error='Connection configuration: '+window.CouncilConfigurationError; }
    catch(err) { S.error=err.message||'Could not connect. Check your settings and try again.'; }
    render();
  }
  boot();
})();

</script>
</body>
</html>
